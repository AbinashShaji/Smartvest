{% extends "user/base_app.html" %}

{% block title %}Goals - SmartVest{% endblock %}
{% block page_title %}Financial Goals{% endblock %}

{% block content %}
<style>
    .goals-module {
        --bg-base: #0a0a0a;
        --bg-card-outer: #111111;
        --bg-card-inner: #1a1a0a;
        --bg-card-hover: #1f1f0f;
        --accent-gold: #b8860b;
        --accent-gold-lt: #d4a017;
        --accent-amber: #92400e;
        --accent-green: #065f46;
        --accent-red: #7f1d1d;
        --text-primary: #ffffff;
        --text-secondary: #a3a3a3;
        --text-muted: #525252;
        --text-label: #6b6b4a;
        --border-outer: #2a2a2a;
        --border-inner: #2a2500;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text-secondary);
        display: grid;
        gap: 20px;
    }

    .goals-module-bar {
        min-height: 56px;
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-radius: 12px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .goals-tabs {
        display: flex;
        gap: 0;
        background: #1a1a1a;
        border: 1px solid var(--border-outer);
        border-radius: 10px;
        padding: 4px;
    }

    .goals-tab-btn {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
    }

    .goals-tab-btn.is-active {
        background: #fff;
        color: #000;
    }

    .goals-cta {
        background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-lt));
        border: none;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #000;
        cursor: pointer;
    }

    .goals-view {
        display: none;
        gap: 16px;
    }

    .goals-view.is-active {
        display: grid;
    }

    .goals-dashboard-stack {
        display: grid;
        gap: 16px;
    }

    .goal-section {
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-radius: 12px;
        padding: 28px 32px;
    }

    .goal-section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
    }

    .goal-label {
        margin: 0 0 8px;
        color: var(--text-label);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
    }

    .goal-title {
        margin: 0 0 6px;
        color: var(--text-primary);
        font-size: 28px;
        font-weight: 700;
    }

    .goal-subtitle {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 400;
    }

    .goal-title.is-healthy { color: #10b981; }
    .goal-title.is-stressed { color: #d4a017; }
    .goal-title.is-critical { color: #ef4444; }

    .goal-head-side {
        color: var(--text-secondary);
        font-size: 14px;
    }

    .goal-metrics-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
    }

    .goal-metric-card {
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-radius: 10px;
        padding: 20px 24px;
    }

    .goal-metric-label {
        margin: 0 0 8px;
        color: var(--text-label);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .goal-metric-value {
        margin: 0;
        color: var(--text-primary);
        font-size: 36px;
        font-weight: 700;
        line-height: 1.1;
    }

    .goal-metric-sub {
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 400;
    }

    .goal-inline-warning {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-secondary);
    }

    .goal-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        flex: 0 0 auto;
    }

    .dot-amber { background: var(--accent-gold-lt); }
    .dot-green { background: #10b981; }
    .dot-red { background: #ef4444; }
    .dot-muted { background: #6b7280; }

    .goal-risk-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
    }

    .goal-risk-card {
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-left-width: 4px;
        border-radius: 10px;
        padding: 20px 24px;
    }

    .risk-amber { border-left-color: var(--accent-gold-lt); }
    .risk-red { border-left-color: #ef4444; }

    .goal-risk-title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: #fff;
    }

    .goal-risk-text,
    .goal-risk-line {
        margin: 0 0 6px;
        color: var(--text-secondary);
        font-size: 14px;
    }

    .goal-risk-line::before {
        content: "- ";
        color: var(--text-label);
    }

    .goal-filter-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
    }

    .goal-filter-tabs {
        display: flex;
        gap: 18px;
        align-items: center;
    }

    .goal-filter-tab {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 0 6px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
    }

    .goal-filter-tab.is-active {
        color: #fff;
        border-bottom-color: var(--accent-gold-lt);
    }

    .goal-filter-tools {
        display: flex;
        gap: 8px;
    }

    .goal-input {
        background: #121212;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #fff;
        padding: 8px 10px;
        min-width: 180px;
    }

    .goal-row {
        display: grid;
        grid-template-columns: 80px minmax(260px, 1fr) minmax(340px, 1fr) auto;
        align-items: center;
        gap: 16px;
        border-left: 4px solid #6b7280;
    }

    .goal-row + .goal-row {
        margin-top: 12px;
    }

    .goal-row.border-critical { border-left-color: #ef4444; }
    .goal-row.border-medium { border-left-color: var(--accent-gold-lt); }
    .goal-row.border-low { border-left-color: #6b7280; }

    .goal-ring {
        width: 72px;
        height: 72px;
    }

    .goal-name {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
    }

    .goal-deadline {
        margin: 0 0 8px;
        color: var(--text-secondary);
        font-size: 12px;
    }

    .goal-status {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
    }

    .goal-inline-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .goal-inline-stat {
        padding: 0 12px;
    }

    .goal-inline-stat + .goal-inline-stat {
        border-left: 1px solid var(--border-outer);
    }

    .goal-inline-stat .goal-metric-label {
        margin-bottom: 4px;
    }

    .goal-inline-stat .value {
        color: #fff;
        font-size: 16px;
        font-weight: 700;
    }

    .goal-actions {
        display: grid;
        justify-items: end;
        gap: 8px;
    }

    .goal-action-btn {
        background: transparent;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 13px;
        color: #fff;
        cursor: pointer;
    }

    .goal-overflow {
        position: relative;
    }

    .goal-overflow-trigger {
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        width: 34px;
        height: 30px;
        cursor: pointer;
    }

    .goal-overflow-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        display: none;
        min-width: 140px;
        padding: 6px;
        z-index: 200;
    }

    .goal-overflow.is-open .goal-overflow-menu {
        display: grid;
    }

    .goal-overflow-menu .goal-action-btn {
        border: none;
        padding: 7px 8px;
        text-align: left;
        width: 100%;
    }

    .goal-detail-select-row {
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-radius: 12px;
        padding: 14px 18px;
    }

    .goal-detail-select {
        width: 100%;
        margin-top: 8px;
    }

    .goal-detail-two-col {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 14px;
    }

    .goal-detail-stack {
        display: grid;
        gap: 12px;
    }

    .goal-detail-card {
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-left: 4px solid var(--accent-gold-lt);
        border-radius: 10px;
        padding: 16px 18px;
    }

    .goal-detail-card h4 {
        margin: 0 0 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
    }

    .goal-detail-card p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.45;
    }

    .goal-velocity {
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-radius: 10px;
        padding: 20px 18px;
    }

    .goal-velocity-track {
        margin: 10px 0 12px;
        height: 6px;
        border-radius: 999px;
        background: #222;
        overflow: hidden;
    }

    .goal-velocity-fill {
        height: 100%;
        background: var(--accent-gold-lt);
    }

    .goal-velocity-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #2a2a2a;
        font-size: 14px;
        color: var(--text-secondary);
    }

    .goal-velocity-row:last-child {
        border-bottom: none;
    }

    .goal-velocity-row strong {
        color: #fff;
    }

    .value-amber { color: var(--accent-gold-lt) !important; }

    .goal-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1000;
    }

    .goal-modal.is-open {
        display: flex;
    }

    .goal-modal-panel {
        width: min(720px, 96vw);
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-radius: 12px;
        padding: 20px;
    }

    .goals-page {
        display: grid;
        gap: 20px;
    }

    .goals-shell,
    .goals-section,
    .goals-selector-bar,
    .goals-hero-card,
    .goals-decision-card,
    .goals-report-card,
    .goals-filter-shell,
    .goals-detail-shell {
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-radius: 12px;
    }

    .goals-shell {
        padding: 28px 32px;
        display: grid;
        gap: 16px;
    }

    .goals-section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
    }

    .goals-hero-card {
        padding: 0;
        border: none;
        background: transparent;
    }

    .goals-hero-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-start;
    }

    .goals-label,
    .goals-card-label,
    .goals-metric-label {
        margin: 0;
        color: var(--text-label);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .goals-hero-title,
    .goals-section-title {
        margin: 6px 0 6px;
        color: var(--text-primary);
        font-size: clamp(2.1rem, 4vw, 2.7rem);
        font-weight: 700;
        line-height: 1.05;
    }

    .goals-hero-title.is-healthy { color: #10b981; }
    .goals-hero-title.is-stressed { color: var(--accent-gold-lt); }
    .goals-hero-title.is-critical { color: #ef4444; }

    .goals-subtitle,
    .goals-card-subtitle,
    .goals-copy {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.55;
    }

    .goals-status-line {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .goals-status-dot,
    .goal-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex: 0 0 auto;
    }

    .dot-amber,
    .goals-status-dot.is-stressed { background: var(--accent-gold-lt); }
    .dot-green,
    .goals-status-dot.is-healthy { background: #10b981; }
    .dot-red,
    .goals-status-dot.is-critical { background: #ef4444; }
    .dot-muted { background: #6b7280; }

    .goals-decision-card {
        padding: 20px;
        background: rgba(255, 255, 255, 0.02);
    }

    .goals-decision-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
    }

    .goals-decision-col h4,
    .goals-signal-card h4,
    .goals-detail-card h4,
    .goals-velocity h4 {
        margin: 0 0 10px;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .goals-decision-list {
        display: grid;
        gap: 8px;
    }

    .goals-decision-item {
        padding: 10px 12px;
        border-left: 3px solid var(--accent-amber);
        border-radius: 0 8px 8px 0;
        background: rgba(255, 255, 255, 0.02);
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.45;
    }

    .goals-warning-bar {
        margin-top: 16px;
        padding: 10px 16px;
        border-radius: 8px;
        background: rgba(146, 64, 14, 0.3);
        border: 1px solid var(--accent-amber);
        color: var(--text-secondary);
        font-size: 14px;
    }

    .goals-warning-bar strong {
        color: var(--accent-gold-lt);
        font-weight: 700;
    }

    .goals-tabs {
        display: flex;
        gap: 4px;
        background: linear-gradient(135deg, rgba(40, 31, 19, 0.23), rgba(0, 0, 0, 0.2));
        border: 1px solid var(--border-outer);
        border-radius: 12px;
        padding: 4px;
        flex-wrap: wrap;
        align-items: center;
    }

    .goals-tab-btn {
        padding: 10px 18px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
    }

    .goals-tab-btn.is-active {
        background: #ffffff;
        color: #000000;
    }

    .goals-cta {
        margin-left: auto;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-lt));
        color: #000;
        font-weight: 600;
        cursor: pointer;
    }

    .goals-panel {
        display: none;
        gap: 20px;
    }

    .goals-panel.is-active {
        display: grid;
    }

    .goals-section {
        padding: 28px 32px;
        display: grid;
        gap: 20px;
    }

    .goals-metrics-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
    }

    .goals-metric-card,
    .goals-detail-card,
    .goals-velocity {
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-radius: 10px;
    }

    .goals-metric-card {
        padding: 20px 24px;
    }

    .goals-metric-value {
        margin: 8px 0 4px;
        color: var(--text-primary);
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.05;
    }

    .goals-metric-subtitle,
    .goals-metric-note {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
    }

    .goals-signals-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
    }

    .goals-signal-card {
        padding: 20px 24px;
        background: linear-gradient(135deg, #1a1a0a, #141400);
        border: 1px solid var(--border-inner);
        border-left-width: 4px;
        border-radius: 10px;
    }

    .goals-signal-card.is-amber { border-left-color: var(--accent-gold-lt); }
    .goals-signal-card.is-red { border-left-color: var(--accent-red); }
    .goals-signal-card.is-green { border-left-color: var(--accent-green); }

    .goals-signal-list {
        display: grid;
        gap: 8px;
        margin: 0;
    }

    .goals-signal-item {
        margin: 0;
        padding-left: 12px;
        border-left: 3px solid var(--accent-amber);
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.45;
    }

    .goals-filter-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .goals-filter-tabs {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        align-items: center;
    }

    .goals-filter-tab {
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0 0 6px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
    }

    .goals-filter-tab.is-active {
        color: var(--text-primary);
        border-bottom-color: var(--accent-gold-lt);
    }

    .goals-filter-tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .goals-input {
        background: #121212;
        border: 1px solid transparent;
        border-radius: 8px;
        color: #fff;
        padding: 10px 12px;
        min-width: 180px;
    }

    .goals-card-stack {
        display: grid;
        gap: 12px;
    }

    .goals-goal-card {
        display: grid;
        grid-template-columns: 84px minmax(220px, 1fr) minmax(280px, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 20px 24px;
        background: var(--bg-card-outer);
        border: 1px solid var(--border-outer);
        border-left-width: 4px;
        border-radius: 12px;
    }

    .goals-goal-card.border-critical { border-left-color: var(--accent-red); }
    .goals-goal-card.border-medium { border-left-color: var(--accent-gold-lt); }
    .goals-goal-card.border-low { border-left-color: #6b7280; }

    .goals-ring {
        width: 72px;
        height: 72px;
    }

    .goals-goal-name {
        margin: 0 0 6px;
        color: var(--text-primary);
        font-size: 18px;
        font-weight: 700;
    }

    .goals-goal-meta {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
    }

    .goals-inline-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0;
    }

    .goals-inline-stat {
        padding: 0 12px;
    }

    .goals-inline-stat + .goals-inline-stat {
        border-left: 1px solid var(--border-outer);
    }

    .goals-inline-stat .goals-metric-label {
        margin-bottom: 4px;
    }

    .goals-inline-stat .goals-inline-value {
        color: var(--text-primary);
        font-size: 16px;
        font-weight: 700;
        margin-top: 4px;
    }

    .goals-card-actions {
        display: grid;
        justify-items: end;
        gap: 8px;
    }

    .goals-action-btn {
        background: transparent;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 13px;
        color: #fff;
        cursor: pointer;
    }

    .goals-action-btn--danger {
        border-color: var(--accent-red);
        color: #fca5a5;
    }

    .goals-overflow {
        position: relative;
    }

    .goals-overflow-trigger {
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        width: 34px;
        height: 30px;
        cursor: pointer;
    }

    .goals-overflow-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background: #111;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        display: none;
        min-width: 140px;
        padding: 6px;
        z-index: 200;
    }

    .goals-overflow.is-open .goals-overflow-menu {
        display: grid;
    }

    .goals-overflow-menu .goals-action-btn {
        border: none;
        padding: 7px 8px;
        text-align: left;
        width: 100%;
    }

    .goals-selector-bar {
        padding: 16px 18px;
        margin-bottom: 14px;
    }

    .goals-detail-select {
        width: 100%;
        margin-top: 8px;
    }

    .goals-detail-report {
        padding: 28px 32px;
        display: grid;
        gap: 16px;
    }

    .goals-detail-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 14px;
    }

    .goals-detail-stack {
        display: grid;
        gap: 12px;
    }

    .goals-detail-card {
        padding: 16px 18px;
        border-left: 4px solid var(--accent-gold-lt);
    }

    .goals-detail-card p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.45;
    }

    .goals-velocity {
        padding: 20px 18px;
    }

    .goals-progress-track {
        margin: 10px 0 12px;
        height: 6px;
        border-radius: 999px;
        background: #222;
        overflow: hidden;
    }

    .goals-progress-fill {
        height: 100%;
        background: var(--accent-gold-lt);
    }

    .goals-velocity-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #2a2a2a;

        color: var(--text-secondary);

    .goals-velocity-row:last-child {

    }

    .goals-velocity-row strong {

    }

    .goals-empty-state {
        padding: 20px;
        border-radius: 12px;
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: var(--text-secondary);

    .goals-modal-panel .goals-input {

    @media (max-width: 1100px) {

        .goals-signals-grid,
        .goals-detail-grid {
            grid-template-columns: 1fr;
        }

        .goals-goal-card {
            grid-template-columns: 72px 1fr;
        }

        .goals-inline-stats,
        .goals-card-actions {
            grid-column: 1 / -1;
        }
    }

    @media (max-width: 768px) {
        .goals-shell,
        .goals-section,
        .goals-detail-report {
            padding: 20px;
        }

        .goals-hero-row {
            flex-direction: column;
        }

        .goals-decision-grid {
            grid-template-columns: 1fr;
        }

        .goals-filter-bar {
            align-items: stretch;
        }

        .goals-filter-tools,
        .goals-tabs {
            width: 100%;
        }

        .goals-cta {
            margin-left: 0;
            width: 100%;
        }
    }
</style>

{% block scripts %}
<script>
    (function () {
        const state = {
            view: 'dashboard',
            filter: 'all',
            search: '',
            sort: 'priority',
            goals: [],
            portfolio: {},
            detailGoalId: null,
            openOverflowGoalId: null,
            dashboardRefreshTimer: null,
            portfolioStale: false,
        };

        const PRIORITY_ORDER = { critical: 1, high: 2, medium: 3, low: 4 };
        const currency = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const $ = (selector) => document.querySelector(selector);
        const esc = (value) => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const n = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
        const money = (value) => currency.format(n(value));
        const tc = (value) => {
            const normalized = String(value || '').toLowerCase().trim();
            return normalized ? normalized[0].toUpperCase() + normalized.slice(1) : 'n/a';
        };

        async function rawRequest(endpoint, options = {}) {
            const response = await fetch(endpoint, {
                credentials: 'same-origin',
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {}),
                },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.status === 'error') {
                throw new Error(payload.message || `Request failed (${response.status})`);
            }
            return payload;
        }

        function normalizeGoal(goal, fallback = {}) {
            const source = { ...fallback, ...(goal || {}) };
            const target = n(source.target_amount);
            const saved = n(source.saved_amount);
            const remaining = Math.max(0, target - saved);
            const progress = target > 0 ? (saved / target) * 100 : 0;
            return {
                ...source,
                id: source.id != null ? source.id : fallback.id,
                target_amount: target,
                saved_amount: saved,
                remaining_amount: n(source.remaining_amount, remaining),
                progress_percent: n(source.progress_percent, progress),
                analysis: source.analysis || fallback.analysis || {},
                smart_analysis: source.smart_analysis || fallback.smart_analysis || {},
            };
        }

        function setGoals(goals) {
            state.goals = Array.isArray(goals) ? goals.map((goal) => normalizeGoal(goal)) : [];
            if (state.detailGoalId && !state.goals.some((goal) => String(goal.id) === String(state.detailGoalId))) {
                state.detailGoalId = state.goals[0] ? state.goals[0].id : null;
            }
        }

        function getGoalById(goalId) {
            return state.goals.find((goal) => String(goal.id) === String(goalId));
        }

        function extractGoalData(payload, fallback = {}) {
            const source = payload && typeof payload === 'object'
                ? (payload.data ?? payload.goal ?? payload.updated ?? payload.result ?? payload)
                : payload;
            return normalizeGoal(source, fallback);
        }

        function upsertGoal(goal, preserveAnalysis = true) {
            if (!goal) return null;
            const nextGoal = normalizeGoal(goal);
            const index = state.goals.findIndex((item) => String(item.id) === String(nextGoal.id));
            if (index >= 0) {
                const existing = state.goals[index];
                state.goals[index] = preserveAnalysis ? normalizeGoal(nextGoal, existing) : nextGoal;
            } else {
                state.goals.unshift(nextGoal);
            }
            return nextGoal;
        }

        function removeGoal(goalId) {
            state.goals = state.goals.filter((goal) => String(goal.id) !== String(goalId));
        }

        function closeAllOverflowMenus() {
            const openNode = state.openOverflowGoalId != null
                ? document.querySelector(`[data-overflow-goal="${state.openOverflowGoalId}"]`)
                : null;
            if (openNode) {
                openNode.classList.remove('is-open');
                openNode.querySelector('.goals-overflow-trigger')?.setAttribute('aria-expanded', 'false');
            } else {
                document.querySelectorAll('.goals-overflow.is-open').forEach((node) => {
                    node.classList.remove('is-open');
                    node.querySelector('.goals-overflow-trigger')?.setAttribute('aria-expanded', 'false');
                });
            }
            state.openOverflowGoalId = null;
        }

        function healthTone(value) {
            const x = String(value || '').toLowerCase();
            if (x === 'healthy') return 'is-healthy';
            if (x === 'stressed' || x === 'watch') return 'is-stressed';
            return 'is-critical';
        }

        function statusLabel(value) {
            const x = String(value || '').toLowerCase();
            if (x === 'healthy') return 'HEALTHY';
            if (x === 'stressed') return 'STRESSED';
            return 'CRITICAL';
        }

        function ring(goal) {
            const p = Math.max(0, Math.min(100, n(goal.progress_percent)));
            const r = 28;
            const c = 2 * Math.PI * r;
            const off = c * (1 - p / 100);
            const pr = String(goal.priority || 'low').toLowerCase();
            const col = pr === 'critical' ? '#ef4444' : (pr === 'medium' || pr === 'high') ? '#d4a017' : '#6b7280';
            return `
                <svg class="goal-ring" viewBox="0 0 72 72" aria-hidden="true">
                    <circle cx="36" cy="36" r="${r}" fill="none" stroke="#2a2a2a" stroke-width="6"></circle>
                    <circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
                        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 36 36)"></circle>
                    <text x="36" y="40" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${p.toFixed(0)}%</text>
                </svg>
            `;
        }

        function statusDot(status) {
            const s = String(status || 'active').toLowerCase();
            if (s === 'active') return 'dot-green';
            if (s === 'paused') return 'dot-amber';
            if (s === 'completed') return 'dot-muted';
            return 'dot-red';
        }

        function borderTone(goal) {
            const p = String(goal.priority || 'low').toLowerCase();
            if (p === 'critical' || p === 'high') return 'border-critical';
            if (p === 'medium') return 'border-medium';
            return 'border-low';
        }

        function buildLocalPortfolioSummary() {
            const activeGoals = state.goals.filter((goal) => String(goal.status || 'active').toLowerCase() === 'active');
            const pausedGoals = state.goals.filter((goal) => String(goal.status || '').toLowerCase() === 'paused');
            const completedGoals = state.goals.filter((goal) => String(goal.status || '').toLowerCase() === 'completed');
            const archivedGoals = state.goals.filter((goal) => String(goal.status || '').toLowerCase() === 'archived');
            const totalTarget = state.goals.reduce((sum, goal) => sum + n(goal.target_amount), 0);
            const totalSaved = state.goals.reduce((sum, goal) => sum + n(goal.saved_amount), 0);
            const totalRemaining = Math.max(0, totalTarget - totalSaved);
            const avgProgress = totalTarget > 0 ? (totalSaved / totalTarget) * 100 : 0;

            return {
                total_goals: state.goals.length,
                active_goals: activeGoals.length,
                paused_goals: pausedGoals.length,
                completed_goals: completedGoals.length,
                archived_goals: archivedGoals.length,
                total_target: totalTarget,
                total_saved: totalSaved,
                total_remaining: totalRemaining,
                avg_progress: avgProgress,
            };
        }

        function mergedPortfolioSummary() {
            return {
                ...buildLocalPortfolioSummary(),
                ...state.portfolio,
            };
        }

        function lifecycleActions(status) {
            const s = String(status || 'active').toLowerCase();
            if (s === 'active') return ['paused', 'completed', 'archived'];
            if (s === 'paused') return ['active', 'archived'];
            if (s === 'completed') return ['archived'];
            return [];
        }

        function filteredGoals() {
            return state.goals
                .filter((goal) => state.filter === 'all' || String(goal.status || '').toLowerCase() === state.filter)
                .filter((goal) => !state.search || String(goal.goal_name || '').toLowerCase().includes(state.search.toLowerCase()))
                .sort((a, b) => {
                    if (state.sort === 'deadline') return String(a.deadline || '9999-12-31').localeCompare(String(b.deadline || '9999-12-31'));
                    if (state.sort === 'progress') return n(b.progress_percent) - n(a.progress_percent);
                    if (state.sort === 'remaining') return n(b.remaining_amount) - n(a.remaining_amount);
                return (PRIORITY_ORDER[String(a.priority || 'medium').toLowerCase()] || 3) - (PRIORITY_ORDER[String(b.priority || 'medium').toLowerCase()] || 3);
            });
        }

        function renderDashboard() {
            const p = mergedPortfolioSummary();
            const health = String(p.portfolio_feasibility || 'critical').toLowerCase();
            const tone = healthTone(health);
            const warnings = Array.isArray(p.warnings) ? p.warnings : [];
            const conflicts = Array.isArray(p.conflicts) ? p.conflicts : [];
            const loadRatioValue = n(p.allocation_load_ratio ?? p.load_ratio ?? 0);
            const availableSavings = n(p.available_monthly_savings ?? p.available_savings ?? 0);
            const requiredSavings = n(p.required_monthly_savings);
            const topSignal = warnings[0] || (conflicts[0] && (conflicts[0].message || conflicts[0].type || conflicts[0])) || 'No immediate savings pressure detected.';
            const signals = [
                loadRatioValue > 1
                    ? `Required monthly savings exceed available savings by $${money(Math.max(0, requiredSavings - availableSavings))}.`
                    : `Allocation load remains at ${loadRatioValue.toFixed(2)}x.`,
                topSignal,
                conflicts[0] && (conflicts[0].message || conflicts[0].type || conflicts[0]),
            ].filter(Boolean).slice(0, 3);
            const actions = [
                loadRatioValue > 1 ? 'Increase monthly allocation' : 'Maintain current allocation',
                warnings.length || conflicts.length ? 'Review goal priorities' : 'Keep monitoring current pace',
                conflicts.length ? 'Extend or shift deadlines' : 'Continue current plan',
            ];
            if (tone !== 'is-healthy') {
                actions.unshift('Reduce low-priority commitments');
            }

            const hero = $('#goalsHero');
            if (hero) {
                hero.innerHTML = `
                    <div class="goals-hero-card">
                        <div class="goals-hero-row">
                            <div>
                                <p class="goals-label">SMARTVEST GOALS</p>
                                <h1 class="goals-hero-title ${tone}">${esc(statusLabel(health))}</h1>
                                <p class="goals-subtitle">Total progress ${n(p.avg_progress).toFixed(1)}% across ${n(p.total_goals)} goals</p>
                            </div>
                            <div class="goals-status-line">
                                <span class="goals-status-dot ${tone}"></span>
                                <span>${statusLabel(health)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            const decision = $('#goalsDecision');
            if (decision) {
                const decisionDescription = tone === 'is-healthy'
                    ? 'Your goal plan has room to breathe and the current allocation can keep pace.'
                    : tone === 'is-stressed'
                        ? 'The plan is workable but monthly savings are running close to the limit.'
                        : 'The current goal mix is asking for more monthly savings than the portfolio can safely support.';

                decision.innerHTML = `
                    <div class="goals-decision-card">
                        <div>
                            <p class="goals-label">Decision</p>
                            <h2 class="goals-section-title">Portfolio Status: ${statusLabel(health)}</h2>
                            <p class="goals-subtitle">${esc(decisionDescription)}</p>
                        </div>
                        <div class="goals-decision-grid">
                            <div class="goals-decision-col">
                                <h4>Signals</h4>
                                <div class="goals-decision-list">
                                    ${signals.map((item) => `<div class="goals-decision-item">${esc(item)}</div>`).join('')}
                                </div>
                            </div>
                            <div class="goals-decision-col">
                                <h4>Actions</h4>
                                <div class="goals-decision-list">
                                    ${actions.slice(0, 3).map((item) => `<div class="goals-decision-item">${esc(item)}</div>`).join('')}
                                </div>
                            </div>
                        </div>
                        ${(tone !== 'is-healthy' || warnings.length || conflicts.length) ? `
                            <div class="goals-warning-bar">
                                <strong>WARNING:</strong> Required monthly savings exceed available savings.
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            const metrics = $('#goalsMetrics');
            if (metrics) {
                metrics.innerHTML = `
                    <section class="goals-section">
                        <div class="goals-metrics-grid">
                            <article class="goals-metric-card"><p class="goals-metric-label">Target</p><p class="goals-metric-value">${money(p.total_target)}</p><p class="goals-metric-subtitle">Portfolio total</p></article>
                            <article class="goals-metric-card"><p class="goals-metric-label">Saved</p><p class="goals-metric-value">${money(p.total_saved)}</p><p class="goals-metric-subtitle">Current progress</p></article>
                            <article class="goals-metric-card"><p class="goals-metric-label">Remaining</p><p class="goals-metric-value">${money(p.total_remaining)}</p><p class="goals-metric-subtitle">To complete</p></article>
                            <article class="goals-metric-card"><p class="goals-metric-label">Active</p><p class="goals-metric-value">${n(p.active_goals)}</p><p class="goals-metric-subtitle">In execution</p></article>
                            <article class="goals-metric-card"><p class="goals-metric-label">Paused/Done</p><p class="goals-metric-value">${n(p.paused_goals)}/${n(p.completed_goals)}</p><p class="goals-metric-subtitle">Lifecycle mix</p></article>
                        </div>
                    </section>
                `;
            }

            const signalsPanel = $('#goalsSignals');
            if (signalsPanel) {
                signalsPanel.innerHTML = `
                    <section class="goals-section">
                        <div class="goals-section-head">
                            <div>
                                <p class="goals-label">Signals & Risks</p>
                                <h2 class="goals-section-title" style="font-size: 28px;">Portfolio Diagnostics</h2>
                                <p class="goals-subtitle">Feasibility pressure and deadline conflict visibility.</p>
                            </div>
                        </div>
                        <div class="goals-signals-grid">
                            <article class="goals-signal-card is-amber">
                                <p class="goals-card-label">Allocation Load</p>
                                <h4>Signals</h4>
                                <p class="goals-copy">Available savings: ${money(availableSavings)}</p>
                                <p class="goals-copy">Load ratio: ${loadRatioValue.toFixed(2)}x</p>
                            </article>
                            <article class="goals-signal-card is-amber">
                                <p class="goals-card-label">Feasibility Signals</p>
                                <h4>Warnings</h4>
                                <div class="goals-signal-list">
                                    ${warnings.length ? warnings.slice(0, 3).map((item) => `<p class="goals-signal-item">${esc(item)}</p>`).join('') : '<p class="goals-copy">No warnings at this time.</p>'}
                                </div>
                            </article>
                            <article class="goals-signal-card is-red">
                                <p class="goals-card-label">Upcoming Risks</p>
                                <h4>Deadline Conflicts</h4>
                                <div class="goals-signal-list">
                                    ${conflicts.length ? conflicts.slice(0, 3).map((item) => `<p class="goals-signal-item">${esc(item.message || item.type || item)}</p>`).join('') : '<p class="goals-copy">No overlapping deadline risk detected.</p>'}
                                </div>
                            </article>
                        </div>
                    </section>
                `;
            }
        }

        function buildGoalRow(goal) {
            const actions = lifecycleActions(goal.status).map((s) => `<button class="goal-action-btn" type="button" data-action="status" data-id="${goal.id}" data-status="${s}">${tc(s)}</button>`).join('');
            return `
                <article class="goals-goal-card ${borderTone(goal)}" data-goal-card="${goal.id}">
                    <div>${ring(goal)}</div>
                    <div>
                        <h4 class="goals-goal-name">${esc(goal.goal_name)}</h4>
                        <p class="goals-card-subtitle">${goal.deadline ? `Deadline: ${esc(goal.deadline)}` : 'No deadline set'}</p>
                        <div class="goals-goal-meta">
                            <span><span class="goal-dot ${statusDot(goal.status)}"></span> ${tc(goal.status)}</span>
                            <span><span class="goal-dot dot-amber"></span> ${tc(goal.priority)}</span>
                        </div>
                    </div>
                    <div class="goals-inline-stats">
                        <div class="goals-inline-stat"><p class="goals-metric-label">Remaining</p><p class="goals-inline-value">${money(goal.remaining_amount)}</p></div>
                        <div class="goals-inline-stat"><p class="goals-metric-label">Allocated/Mo</p><p class="goals-inline-value">${money(goal.analysis?.allocated_monthly)}</p></div>
                        <div class="goals-inline-stat"><p class="goals-metric-label">Projection</p><p class="goals-inline-value">${goal.analysis?.realistic_months == null ? 'n/a' : `${n(goal.analysis.realistic_months).toFixed(1)} mo`}</p></div>
                    </div>
                    <div class="goals-card-actions">
                        <button class="goals-action-btn" type="button" data-action="detail" data-id="${goal.id}">View Analysis</button>
                        <div class="goals-overflow" data-overflow-goal="${goal.id}">
                            <button class="goals-overflow-trigger" type="button" data-action="overflow-toggle" data-id="${goal.id}" aria-expanded="false">...</button>
                            <div class="goals-overflow-menu">
                                <button class="goals-action-btn" type="button" data-action="edit" data-id="${goal.id}">Edit</button>
                                ${actions}
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderPortfolio() {
            const rows = filteredGoals();
            const container = $('#portfolioRows');
            if (!container) return;
            if (!rows.length) {
                container.innerHTML = "<div class='goals-empty-state'>No goals match the current filters.</div>";
                return;
            }

            container.innerHTML = rows.map(buildGoalRow).join('');

            if (state.openOverflowGoalId !== null) {
                const openNode = document.querySelector(`[data-overflow-goal="${state.openOverflowGoalId}"]`);
                if (openNode) {
                    openNode.classList.add('is-open');
                    openNode.querySelector('.goals-overflow-trigger')?.setAttribute('aria-expanded', 'true');
                } else {
                    state.openOverflowGoalId = null;
                }
            }
        }

        function renderDetailSelect() {
            const select = $('#detailGoalSelect');
            if (!select) return;
            const goals = state.goals;
            if (!goals.length) {
                select.innerHTML = '<option value="">No goals available</option>';
                state.detailGoalId = null;
                return;
            }
            if (!state.detailGoalId) {
                state.detailGoalId = goals[0].id;
            }
            select.innerHTML = goals.map((g) => `<option value="${g.id}" ${String(g.id) === String(state.detailGoalId) ? 'selected' : ''}>${esc(g.goal_name)} (${tc(g.status)})</option>`).join('');
        }

        function renderDetailFromGoal(detail) {
            const container = $('#goalDetailSection');
            if (!container) return;
            const a = detail.analysis || {};
            const s = detail.smart_analysis || {};
            const isBelow = n(a.allocated_monthly) < n(a.required_monthly);
            container.innerHTML = `
                <div class="goals-section-head">
                    <div>
                        <p class="goals-label">GOAL DETAIL REPORT</p>
                        <h3 class="goals-section-title" style="font-size: 28px;">${esc(detail.goal_name || 'Goal')}</h3>
                        <p class="goals-subtitle">${detail.deadline ? `Deadline: ${esc(detail.deadline)}` : 'No deadline set'}</p>
                    </div>
                    <div class="goals-status-line"><span class="goal-dot ${statusDot(detail.status)}"></span>${tc(detail.status)}</div>
                </div>
                <div class="goals-detail-grid goals-detail-report">
                    <div class="goals-detail-stack">
                        <article class="goals-detail-card"><h4>Financial Snapshot</h4><p>Target ${money(detail.target_amount)} · Saved ${money(detail.saved_amount)} · Remaining ${money(detail.remaining_amount)}</p></article>
                        <article class="goals-detail-card"><h4>Feasibility</h4><p>${esc(a.insight || 'No projection available')}</p><p>${esc(a.warning || '')}</p></article>
                        <article class="goals-detail-card"><h4>Behavior Signal</h4><p>Top expense category impacting pace: ${esc(s.top_category || 'n/a')}.</p></article>
                    </div>
                    <div class="goals-velocity">
                        <p class="goals-label">SAVINGS VELOCITY</p>
                        <div class="goals-progress-track"><div class="goals-progress-fill" style="width:${Math.max(0, Math.min(100, n(detail.progress_percent))).toFixed(1)}%"></div></div>
                        <div class="goals-velocity-row"><span>Progress</span><strong>${n(detail.progress_percent).toFixed(1)}%</strong></div>
                        <div class="goals-velocity-row"><span>Allocated / month</span><strong>${money(a.allocated_monthly)}</strong></div>
                        <div class="goals-velocity-row"><span>Required / month</span><strong class="${isBelow ? 'value-amber' : ''}">${money(a.required_monthly)}</strong></div>
                        <div class="goals-velocity-row"><span>Projected completion</span><strong>${a.realistic_months == null ? 'n/a' : `${n(a.realistic_months).toFixed(1)} mo`}</strong></div>
                    </div>
                </div>
            `;
        }

        async function renderDetail(forceRefresh = false) {
            if (state.view !== 'detail' || !state.detailGoalId) {
                return;
            }

            const localGoal = getGoalById(state.detailGoalId);
            if (localGoal && localGoal.analysis && !forceRefresh) {
                renderDetailFromGoal(localGoal);
                return;
            }

            const container = $('#goalDetailSection');
            if (container) {
                container.innerHTML = '<div class="goals-empty-state">Loading detail...</div>';
            }
            try {
                const payload = await rawRequest(`/api/expense/goal/${state.detailGoalId}`);
                const detail = extractGoalData(payload, localGoal || {});
                upsertGoal(detail, true);
                renderDetailFromGoal(detail);
            } catch (error) {
                if (container) {
                    container.innerHTML = `<div class="goals-empty-state">${esc(error.message || 'Unable to load goal detail.')}</div>`;
                }
            }
        }

        async function setView(view) {
            if (state.view === view) {
                if (view === 'detail') {
                    renderDetailSelect();
                    await renderDetail();
                }
                return;
            }
            state.view = view;
            const dashboardView = document.getElementById('dashboardView');
            const portfolioView = document.getElementById('portfolioView');
            const detailView = document.getElementById('detailView');
            if (dashboardView) dashboardView.classList.toggle('is-active', view === 'dashboard');
            if (portfolioView) portfolioView.classList.toggle('is-active', view === 'portfolio');
            if (detailView) detailView.classList.toggle('is-active', view === 'detail');
            document.querySelectorAll('[data-view-btn]').forEach((button) => button.classList.toggle('is-active', button.dataset.viewBtn === view));
            closeAllOverflowMenus();
            if (view === 'detail') {
                renderDetailSelect();
                renderDetail();
                return;
            }
            if (view === 'dashboard') {
                if (state.portfolioStale) {
                    await loadGoalsSnapshot({ render: false });
                }
                renderDashboard();
                return;
            }
            if (view === 'portfolio') {
                renderPortfolio();
            }
        }

        async function loadGoalsSnapshot({ render = true } = {}) {
            const payload = await rawRequest('/api/expense/goal/all');
            state.portfolio = payload.portfolio_summary || {};
            setGoals(payload.data || []);
            state.portfolioStale = false;
            if (render) {
                if (state.view === 'dashboard') {
                    renderDashboard();
                } else if (state.view === 'portfolio') {
                    renderPortfolio();
                }
                if (state.view === 'detail') {
                    renderDetailSelect();
                    await renderDetail();
                }
            }
            return payload;
        }

        function queueDashboardRefresh() {
            if (state.dashboardRefreshTimer) {
                clearTimeout(state.dashboardRefreshTimer);
            }
            state.dashboardRefreshTimer = setTimeout(async () => {
                state.dashboardRefreshTimer = null;
                if (state.view !== 'dashboard') {
                    return;
                }
                try {
                    await loadGoalsSnapshot({ render: false });
                    renderDashboard();
                } catch (error) {
                    console.error(error);
                }
            }, 150);
        }

        function applyGoalMutation(updatedGoal, options = {}) {
            const normalized = upsertGoal(updatedGoal, options.preserveAnalysis !== false);
            state.portfolioStale = true;
            if (state.view === 'portfolio') {
                renderPortfolio();
            } else if (state.view === 'dashboard') {
                renderDashboard();
                queueDashboardRefresh();
            }
            if (state.view === 'detail' && String(state.detailGoalId) === String(normalized.id)) {
                if (!options.detailRefresh) {
                    renderDetailFromGoal(normalized);
                }
            }
            if (state.view === 'detail') {
                renderDetailSelect();
            }
            return normalized;
        }

        async function handleCreateGoal(payload) {
            const response = await rawRequest('/api/expense/goal/add', {
                method: 'POST',
                body: JSON.stringify(payload),
            });
            return extractGoalData(response, payload);
        }

        async function handleUpdateGoal(payload) {
            const response = await rawRequest('/api/expense/goal/update', {
                method: 'POST',
                body: JSON.stringify(payload),
            });
            return extractGoalData(response, payload);
        }

        async function handleLifecycle(goalId, status) {
            const response = await rawRequest('/api/expense/goal/status', {
                method: 'POST',
                body: JSON.stringify({ goal_id: goalId, status }),
            });
            return extractGoalData(response, { id: goalId, status });
        }

        function openCreate(open) {
            const modal = $('#createGoalModal');
            if (modal) {
                modal.classList.toggle('is-open', open);
            }
        }

        function openEdit(goal) {
            if (!goal) return;
            $('#editGoalId').value = goal.id;
            $('#editGoalName').value = goal.goal_name || '';
            $('#editGoalTarget').value = n(goal.target_amount);
            $('#editGoalSaved').value = n(goal.saved_amount);
            $('#editGoalDeadline').value = goal.deadline || '';
            $('#editGoalPriority').value = String(goal.priority || 'medium');
            $('#editGoalMsg').textContent = '';
            $('#editGoalModal').classList.add('is-open');
        }

        function closeEdit() {
            const modal = $('#editGoalModal');
            if (modal) {
                modal.classList.remove('is-open');
            }
        }

        function bind() {
            document.querySelectorAll('[data-view-btn]').forEach((button) => button.addEventListener('click', () => setView(button.dataset.viewBtn)));

            $('#portfolioFilters').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-filter]');
                if (!btn) return;
                state.filter = btn.dataset.filter;
                document.querySelectorAll('[data-filter]').forEach((x) => x.classList.remove('is-active'));
                btn.classList.add('is-active');
                if (state.view === 'portfolio') {
                    renderPortfolio();
                }
            });

            $('#goalSearch').addEventListener('input', (e) => {
                state.search = e.target.value || '';
                if (state.view === 'portfolio') {
                    renderPortfolio();
                }
            });

            $('#goalSort').addEventListener('change', (e) => {
                state.sort = e.target.value;
                if (state.view === 'portfolio') {
                    renderPortfolio();
                }
            });

            $('#portfolioRows').addEventListener('click', async (e) => {
                const button = e.target.closest('[data-action]');
                if (!button) return;
                e.preventDefault();
                e.stopPropagation();
                const id = button.dataset.id;
                const action = button.dataset.action;
                const overflowNode = e.target.closest('[data-overflow-goal]');

                if (action === 'overflow-toggle') {
                    const node = overflowNode || document.querySelector(`[data-overflow-goal="${id}"]`);
                    if (!node) return;
                    const wasOpen = node.classList.contains('is-open');
                    closeAllOverflowMenus();
                    if (!wasOpen) {
                        node.classList.add('is-open');
                        node.querySelector('.goals-overflow-trigger')?.setAttribute('aria-expanded', 'true');
                        state.openOverflowGoalId = id;
                    }
                    return;
                }

                if (action === 'detail') {
                    closeAllOverflowMenus();
                    state.detailGoalId = id;
                    await setView('detail');
                    return;
                }

                if (action === 'edit') {
                    closeAllOverflowMenus();
                    openEdit(getGoalById(id));
                    return;
                }

                if (action === 'status') {
                    try {
                        const updated = await handleLifecycle(id, button.dataset.status);
                        applyGoalMutation(updated);
                        if (state.view === 'detail' && String(state.detailGoalId) === String(id)) {
                            renderDetailFromGoal(getGoalById(id));
                        }
                    } catch (error) {
                        console.error(error);
                    } finally {
                        closeAllOverflowMenus();
                    }
                }
            });

            $('#detailGoalSelect').addEventListener('change', async (e) => {
                state.detailGoalId = e.target.value;
                if (state.view === 'detail') {
                    await renderDetail();
                }
            });

            document.querySelector('[data-open-create]').addEventListener('click', () => openCreate(true));
            document.querySelector('[data-close-create]').addEventListener('click', () => openCreate(false));
            document.querySelector('[data-close-edit]').addEventListener('click', () => closeEdit());
            $('#createGoalModal').addEventListener('click', (e) => { if (e.target.id === 'createGoalModal') openCreate(false); });
            $('#editGoalModal').addEventListener('click', (e) => { if (e.target.id === 'editGoalModal') closeEdit(); });
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.goals-overflow')) {
                    closeAllOverflowMenus();
                }
            });

            $('#createGoalForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.currentTarget);
                const payload = {
                    name: String(fd.get('name') || '').trim(),
                    target: Number(fd.get('target') || 0),
                    saved: Number(fd.get('saved') || 0),
                    deadline: String(fd.get('deadline') || ''),
                    priority: String(fd.get('priority') || 'medium'),
                    status: 'active',
                };
                const msg = $('#createGoalMsg');
                msg.textContent = 'Creating goal...';
                try {
                    const created = await handleCreateGoal(payload);
                    applyGoalMutation(created, { preserveAnalysis: false });
                    msg.textContent = 'Goal created.';
                    e.currentTarget.reset();
                    openCreate(false);
                    if (state.view === 'detail') {
                        state.detailGoalId = created.id;
                        renderDetailSelect();
                        await renderDetail(true);
                    }
                    if (state.view !== 'detail') {
                        closeAllOverflowMenus();
                    }
                } catch (error) {
                    msg.textContent = error.message || 'Unable to create goal.';
                }
            });

            $('#editGoalForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.currentTarget);
                const payload = {
                    goal_id: String(fd.get('goal_id') || ''),
                    name: String(fd.get('name') || '').trim(),
                    target: Number(fd.get('target') || 0),
                    saved: Number(fd.get('saved') || 0),
                    deadline: String(fd.get('deadline') || ''),
                    priority: String(fd.get('priority') || 'medium'),
                };
                const msg = $('#editGoalMsg');
                msg.textContent = 'Saving changes...';
                try {
                    const updated = await handleUpdateGoal(payload);
                    applyGoalMutation(updated, { detailRefresh: true });
                    msg.textContent = 'Goal updated.';
                    closeEdit();
                    if (state.view === 'detail' && String(state.detailGoalId) === String(updated.id)) {
                        await renderDetail(true);
                    }
                } catch (error) {
                    msg.textContent = error.message || 'Unable to update goal.';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            bind();
            await loadGoalsSnapshot({ render: false });
            renderDashboard();
            renderPortfolio();
            renderDetailSelect();
            if (state.view === 'detail') await renderDetail();
        });
    })();
</script>
{% endblock %}
